<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LineagIQ Control Plane - Knowledge Graph Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Header Bar */
    header {
      height: 64px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .brand-badge {
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input, select, button {
      font-family: inherit;
      font-size: 13px;
      border-radius: 8px;
      outline: none;
    }
    input[type="text"], select {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 12px;
      transition: all 0.2s;
    }
    select {
      cursor: pointer;
    }
    input[type="text"]:focus, select:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }
    .btn {
      background: linear-gradient(135deg, #00f0ff, #0072ff);
      color: #ffffff;
      font-weight: 600;
      border: none;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(0, 240, 255, 0.25);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 240, 255, 0.4);
    }
    .btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: rgba(71, 85, 105, 1);
      color: #fff;
    }
    /* Main Layout */
    .main-container {
      display: flex;
      height: calc(100vh - 64px);
      width: 100vw;
      position: relative;
      overflow: hidden;
    }
    #network-canvas {
      flex: 1;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #111827 0%, #0b0f19 100%);
    }
    /* Sidebar Details Panel */
    .sidebar {
      width: 380px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(16px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 5;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }
    .sidebar-title {
      font-size: 16px;
      font-weight: 600;
      color: #f8fafc;
    }
    .node-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      text-transform: uppercase;
    }
    .badge-Dataset { background: rgba(0, 240, 255, 0.2); color: #00f0ff; border: 1px solid #00f0ff; }
    .badge-Column { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #a855f7; }
    .badge-Pipeline { background: rgba(255, 170, 0, 0.2); color: #ffaa00; border: 1px solid #ffaa00; }
    .badge-User { background: rgba(0, 255, 153, 0.2); color: #00ff99; border: 1px solid #00ff99; }
    
    .detail-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .detail-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }
    .detail-value {
      font-size: 13px;
      color: #cbd5e1;
      word-break: break-all;
    }
    .code-block {
      background: #020617;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      color: #38bdf8;
      border: 1px solid rgba(255, 255, 255, 0.05);
      max-height: 180px;
      overflow-y: auto;
    }

    /* Legend Overlay */
    .legend {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      gap: 16px;
      z-index: 5;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>LineagIQ</span>
      <span class="brand-badge">Graph DAG Visualizer</span>
    </div>

    <div class="controls">
      <select id="view-mode" onchange="filterGraph()">
        <option value="high_level">High-Level Lineage (Datasets & Pipelines)</option>
        <option value="all">Full Detail (Include Columns & Belongings)</option>
      </select>

      <select id="layout-mode" onchange="toggleLayout()">
        <option value="hierarchical">DAG Lineage Layout (Left → Right)</option>
        <option value="physics">Organic Force Layout</option>
      </select>

      <input type="text" id="tenant-input" value="demo_tenant" style="width: 120px;" placeholder="Tenant ID">
      <input type="text" id="data-path-input" value="/tmp/tenants/demo_tenant" style="width: 160px;" placeholder="Data Path">
      <button class="btn" onclick="loadGraph()">Load</button>
      <input type="text" id="search-input" style="width: 140px;" placeholder="Filter name..." oninput="filterGraph()">
    </div>
  </header>

  <div class="main-container">
    <div id="network-canvas"></div>

    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title" id="panel-node-name">Select a Node</span>
        <span class="node-badge badge-Dataset" id="panel-node-type" style="display: none;">Dataset</span>
      </div>

      <div class="detail-group">
        <span class="detail-label">Node ID</span>
        <span class="detail-value code-block" id="panel-node-id">-</span>
      </div>

      <div class="detail-group">
        <span class="detail-label">Description</span>
        <span class="detail-value" id="panel-node-desc">Click on any dataset or pipeline node to view lineage details and operational dependencies.</span>
      </div>

      <div class="detail-group">
        <span class="detail-label">Properties</span>
        <div class="code-block" id="panel-node-props">{}</div>
      </div>

      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
        <button class="btn" id="blast-btn" style="display: none;" onclick="triggerBlastRadius()">⚡ Compute Downstream Blast Radius</button>
        <button class="btn btn-secondary" onclick="resetGraphHighlight()">Reset View</button>
      </div>
    </div>

    <!-- Legend Overlay -->
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background: #00f0ff; box-shadow: 0 0 8px #00f0ff;"></div> Dataset / Table</div>
      <div class="legend-item"><div class="legend-dot" style="background: #ffaa00; box-shadow: 0 0 8px #ffaa00;"></div> Pipeline / Job</div>
      <div class="legend-item"><div class="legend-dot" style="background: #00ff99; box-shadow: 0 0 8px #00ff99;"></div> User / Consumer</div>
      <div class="legend-item" id="legend-column" style="display: none;"><div class="legend-dot" style="background: #a855f7; box-shadow: 0 0 8px #a855f7;"></div> Column</div>
    </div>
  </div>

  <script>
    let network = null;
    let nodesDataSet = null;
    let edgesDataSet = null;
    let rawNodes = [];
    let rawEdges = [];
    let selectedNodeId = null;

    const typeColors = {
      'Dataset': { background: '#0e7490', border: 'transparent', highlight: '#06b6d4' },
      'Column': { background: '#6b21a8', border: 'transparent', highlight: '#a855f7' },
      'Pipeline': { background: '#b45309', border: 'transparent', highlight: '#f59e0b' },
      'User': { background: '#047857', border: 'transparent', highlight: '#10b981' },
      'BusinessTerm': { background: '#9f1239', border: 'transparent', highlight: '#f43f5e' }
    };

    async function loadGraph() {
      const tenantId = document.getElementById('tenant-input').value.trim() || 'demo_tenant';
      const dataPath = document.getElementById('data-path-input').value.trim();

      let url = `/api/v1/tenants/${tenantId}/graph`;
      if (dataPath) {
        url += `?data_path=${encodeURIComponent(dataPath)}`;
      }

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Failed to fetch graph payload");
        const data = await response.json();
        
        rawNodes = data.nodes || [];
        rawEdges = data.edges || [];

        filterGraph();
      } catch (err) {
        alert(`Error loading graph: ${err.message}`);
      }
    }

    function filterGraph() {
      const viewMode = document.getElementById('view-mode').value;
      const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();

      document.getElementById('legend-column').style.display = (viewMode === 'all') ? 'flex' : 'none';

      let visibleNodes = [...rawNodes];

      // View Mode Filtering (High-Level Lineage vs All)
      if (viewMode === 'high_level') {
        visibleNodes = visibleNodes.filter(n => n.type !== 'Column');
      }

      // Name Filter
      if (searchTerm) {
        visibleNodes = visibleNodes.filter(n => 
          (n.name && n.name.toLowerCase().includes(searchTerm)) || 
          (n.id && n.id.toLowerCase().includes(searchTerm)) || 
          (n.type && n.type.toLowerCase().includes(searchTerm))
        );
      }

      const visibleIds = new Set(visibleNodes.map(n => n.id));
      let visibleEdges = rawEdges.filter(e => visibleIds.has(e.source_id) && visibleIds.has(e.target_id));

      if (viewMode === 'high_level') {
        visibleEdges = visibleEdges.filter(e => e.type !== 'BELONGS_TO');
      }

      renderNetwork(visibleNodes, visibleEdges);
    }

    function renderNetwork(nodesData, edgesData) {
      const isHierarchical = (document.getElementById('layout-mode').value === 'hierarchical');

      const formattedNodes = nodesData.map(n => {
        const color = typeColors[n.type] || { background: '#334155', border: 'transparent' };
        const shape = n.type === 'Dataset' ? 'box' : (n.type === 'Pipeline' ? 'ellipse' : 'dot');
        return {
          id: n.id,
          label: n.name || n.id,
          shape: shape,
          size: n.type === 'Dataset' ? 20 : (n.type === 'Pipeline' ? 18 : 12),
          margin: 12,
          borderWidth: 0,
          borderWidthSelected: 2,
          color: {
            background: color.background,
            border: 'transparent',
            highlight: { background: color.highlight, border: '#ffffff' }
          },
          font: { color: '#ffffff', size: 13, face: 'Inter', weight: '600' },
          rawNode: n
        };
      });

      const formattedEdges = edgesData.map(e => {
        return {
          from: e.source_id,
          to: e.target_id,
          label: e.type,
          arrows: { to: { enabled: true, scaleFactor: 0.8 } },
          color: { color: 'rgba(255, 255, 255, 0.5)', highlight: '#00f0ff' },
          font: { 
            color: '#ffffff', 
            size: 11, 
            face: 'Inter', 
            align: 'middle',
            strokeWidth: 0,
            background: 'rgba(15, 23, 42, 0.85)'
          },
          smooth: isHierarchical ? { type: 'cubicBezier', forceDirection: 'horizontal' } : { type: 'continuous' }
        };
      });

      nodesDataSet = new vis.DataSet(formattedNodes);
      edgesDataSet = new vis.DataSet(formattedEdges);

      const container = document.getElementById('network-canvas');
      const data = { nodes: nodesDataSet, edges: edgesDataSet };
      
      const options = {
        nodes: {
          borderWidth: 0,
          shadow: false
        },
        edges: {
          width: 2,
          shadow: false
        },
        layout: {
          hierarchical: {
            enabled: isHierarchical,
            direction: 'LR',
            sortMethod: 'directed',
            nodeSpacing: 160,
            levelSeparation: 220
          }
        },
        physics: {
          enabled: !isHierarchical,
          solver: 'forceAtlas2Based',
          forceAtlas2Based: {
            gravitationalConstant: -40,
            centralGravity: 0.01,
            springLength: 100,
            springConstant: 0.08
          },
          stabilization: { iterations: 100 }
        },
        interaction: { hover: true, tooltipDelay: 200 }
      };

      if (network) network.destroy();
      network = new vis.Network(container, data, options);

      network.once("stabilizationIterationsDone", function() {
        network.fit();
      });

      network.on("selectNode", function (params) {
        if (params.nodes.length > 0) {
          selectedNodeId = params.nodes[0];
          const nodeObj = nodesData.find(n => n.id === selectedNodeId);
          displayNodeDetails(nodeObj);
          highlightConnected(selectedNodeId);
        }
      });

      network.on("deselectNode", function () {
        selectedNodeId = null;
        resetSidebar();
        resetGraphHighlight();
      });
    }

    function toggleLayout() {
      filterGraph();
    }

    function displayNodeDetails(node) {
      if (!node) return;
      document.getElementById('panel-node-name').innerText = node.name || node.id;
      document.getElementById('panel-node-id').innerText = node.id;
      document.getElementById('panel-node-desc').innerText = node.description || 'No description available.';
      document.getElementById('panel-node-props').innerText = typeof node.properties === 'string' ? node.properties : JSON.stringify(node.properties || {}, null, 2);

      const badge = document.getElementById('panel-node-type');
      badge.innerText = node.type || 'Node';
      badge.className = `node-badge badge-${node.type || 'Dataset'}`;
      badge.style.display = 'inline-block';

      document.getElementById('blast-btn').style.display = 'block';
    }

    function highlightConnected(nodeId) {
      const connectedNodes = new Set(network.getConnectedNodes(nodeId));
      connectedNodes.add(nodeId);

      const allNodes = nodesDataSet.get();
      const updatedNodes = allNodes.map(n => {
        const isConnected = connectedNodes.has(n.id);
        return {
          id: n.id,
          opacity: isConnected ? 1.0 : 0.15
        };
      });
      nodesDataSet.update(updatedNodes);
    }

    function resetSidebar() {
      document.getElementById('panel-node-name').innerText = 'Select a Node';
      document.getElementById('panel-node-id').innerText = '-';
      document.getElementById('panel-node-desc').innerText = 'Click on any dataset or pipeline node to view lineage details.';
      document.getElementById('panel-node-props').innerText = '{}';
      document.getElementById('panel-node-type').style.display = 'none';
      document.getElementById('blast-btn').style.display = 'none';
    }

    async function triggerBlastRadius() {
      if (!selectedNodeId) return;
      const tenantId = document.getElementById('tenant-input').value.trim() || 'demo_tenant';
      const dataPath = document.getElementById('data-path-input').value.trim();

      try {
        const response = await fetch(`/api/v1/tenants/${tenantId}/blast-radius`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ node_id: selectedNodeId, max_depth: 5, data_path: dataPath })
        });
        const result = await response.json();
        
        const impactedIds = new Set((result.impacted_nodes || []).map(n => n.id));
        
        const currentNodes = nodesDataSet.get();
        const updatedNodes = currentNodes.map(n => {
          const isImpacted = impactedIds.has(n.id);
          const color = isImpacted 
            ? { background: '#ef4444', border: '#ffffff', highlight: { background: '#ffffff', border: '#ef4444' } }
            : { background: '#1e293b', border: 'transparent' };
          return {
            id: n.id,
            color: color,
            opacity: isImpacted ? 1.0 : 0.2
          };
        });

        nodesDataSet.update(updatedNodes);
        alert(`Blast Radius Calculation Complete!\n${result.impacted_nodes_count} downstream assets impacted.`);
      } catch (err) {
        alert(`Error calculating blast radius: ${err.message}`);
      }
    }

    function resetGraphHighlight() {
      filterGraph();
      resetSidebar();
    }

    window.addEventListener('DOMContentLoaded', loadGraph);
  </script>
</body>
</html>
